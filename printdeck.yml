# Printdeck build of the desiccant basket: a collar, a basket and a lid for the bottom half of a
# round West Marine -50F antifreeze gallon jug, and a cutting ring that cuts the jug with a razor blade.
# The profiles in profiles/ are the Printdeck profiles of the TAZ Workhorse SE (0.5 mm nozzle).
# All parts print in white PLA (to match the pellets) on 0.30 Fast, with faster speeds and no
# supports. The counts are for 1 jug, for the first test. model.py writes the STL files in
# their print orientation.
project: pinkstuff-basket
cover: docs/hero-light.png

generate:
  python: "3.12"
  install: pip install -r requirements.txt
  run: python model.py
  check: false

parts:
  - name: Cutting ring
    group: Tools
    description: >-
      A ring on three legs. The jug stands in the ring, and the ring holds the blade cartridge level at 100 mm above
      the table. One leg braces the shelf, and the feet flare out on the table. Press an M2.5 heat-set insert into the shelf. Print it once, upside down, the ring
      top on the bed.
    printer: taz
    profile: taz-workhorse-se/pla-0.30-fast
    material: roll-5
    settings: {wall_line_count: 2, infill_sparse_density: 30, adhesion_type: brim, brim_line_count: 10, brim_location: outside, speed_print: 80, speed_infill: 80, speed_wall_0: 70, speed_wall_x: 80, speed_topbottom: 70, speed_roofing: 60, speed_layer_0: 30, speed_print_layer_0: 30, skirt_brim_speed: 30, acceleration_print: 3000, acceleration_infill: 3000, acceleration_wall_0: 2000, acceleration_wall_x: 2500, acceleration_topbottom: 2500, acceleration_skirt_brim: 2500, material_print_temperature: 220, cool_min_layer_time: 5}
    files: [stl/jig.stl]
  - name: Blade cartridge
    group: Tools
    description: >-
      Holds a single-edge razor blade. It slides on the shelf of the cutting ring, and the blade goes through the jug
      wall. An M2.5 x 12 socket head screw goes into a heat-set insert in the shelf and clamps the cartridge and the blade. Print it on its back end.
    printer: taz
    profile: taz-workhorse-se/pla-0.30-fast
    material: roll-5
    settings: {wall_line_count: 2, infill_sparse_density: 30, adhesion_type: brim, brim_line_count: 10, brim_location: outside, speed_print: 80, speed_infill: 80, speed_wall_0: 70, speed_wall_x: 80, speed_topbottom: 70, speed_roofing: 60, speed_layer_0: 30, speed_print_layer_0: 30, skirt_brim_speed: 30, acceleration_print: 3000, acceleration_infill: 3000, acceleration_wall_0: 2000, acceleration_wall_x: 2500, acceleration_topbottom: 2500, acceleration_skirt_brim: 2500, material_print_temperature: 220, cool_min_layer_time: 5}
    files: [stl/jig_cart.stl]
  - name: Fit test arc
    group: Tools
    description: >-
      A 50 mm arc of the collar. Print it first. Push its groove over the cut edge. The edge must wedge in, and the arc
      must follow the jug. The jug diameter is from a sample jug: see MEASURE.md. Print it top face down.
    printer: taz
    profile: taz-workhorse-se/pla-0.30-fast
    material: roll-5
    settings: {wall_line_count: 3, infill_sparse_density: 40, adhesion_type: brim, brim_line_count: 10, brim_location: outside, speed_print: 80, speed_infill: 80, speed_wall_0: 70, speed_wall_x: 80, speed_topbottom: 70, speed_roofing: 60, speed_layer_0: 30, speed_print_layer_0: 30, skirt_brim_speed: 30, acceleration_print: 3000, acceleration_infill: 3000, acceleration_wall_0: 2000, acceleration_wall_x: 2500, acceleration_topbottom: 2500, acceleration_skirt_brim: 2500, material_print_temperature: 220, cool_min_layer_time: 5}
    files: [stl/fit_arc.stl]
  - name: Collar
    group: Desiccant basket
    description: >-
      The ring on the cut edge of the jug. A tapered groove grips the edge. A 45 deg seat holds the basket, and a ridge
      on the skirt takes the lid snap. Print it upside down, top face on the bed.
    printer: taz
    profile: taz-workhorse-se/pla-0.30-fast
    material: roll-5
    count: 1
    settings: {wall_line_count: 2, infill_sparse_density: 40, hole_xy_offset: 0, adhesion_type: brim, brim_line_count: 10, brim_location: outside, speed_print: 80, speed_infill: 80, speed_wall_0: 70, speed_wall_x: 80, speed_topbottom: 70, speed_roofing: 60, speed_layer_0: 30, speed_print_layer_0: 30, skirt_brim_speed: 30, acceleration_print: 3000, acceleration_infill: 3000, acceleration_wall_0: 2000, acceleration_wall_x: 2500, acceleration_topbottom: 2500, acceleration_skirt_brim: 2500, material_print_temperature: 220, cool_min_layer_time: 5}
    files: [stl/collar.stl]
  - name: Basket
    group: Desiccant basket
    description: >-
      The basket for the pellets: 0.64 L, 40 mm tall, with a 0.75 mm wall (one line) and a star of floor ribs. The floor is solid in the model. These settings (no skin, lines infill 2.5 mm apart) print it as an open grid with 2 mm openings. Its flared rim sits on the seat of the collar. Print it floor down.
    printer: taz
    profile: taz-workhorse-se/pla-0.30-fast
    material: roll-5
    count: 1
    settings: {wall_line_count: 2, infill_sparse_density: 20, infill_pattern: lines, infill_line_distance: 2.5, zig_zaggify_infill: true, top_layers: 0, bottom_layers: 0, initial_bottom_layers: 0, top_bottom_thickness: 0, roofing_layer_count: 0, flooring_layer_count: 0, hole_xy_offset: 0, adhesion_type: brim, brim_line_count: 10, brim_location: outside, speed_print: 80, speed_infill: 80, speed_wall_0: 80, speed_wall_x: 80, speed_topbottom: 70, speed_roofing: 60, speed_layer_0: 30, speed_print_layer_0: 30, skirt_brim_speed: 30, acceleration_print: 3000, acceleration_infill: 3000, acceleration_wall_0: 2000, acceleration_wall_x: 2500, acceleration_topbottom: 2500, acceleration_skirt_brim: 2500, material_print_temperature: 220, cool_min_layer_time: 5}
    files: [stl/basket.stl]
  - name: Lid
    group: Desiccant basket
    description: >-
      The lid snaps over the ridge of the collar and clamps the collar onto the jug. 8 slits cut its skirt into
      fingers. The plate sits on the basket rim. The plate is solid in the model. These settings print it as an open grid with 2 mm openings, so the pellets stay in. Pull the
      tab to remove it. Print it upside down, top face on the bed.
    printer: taz
    profile: taz-workhorse-se/pla-0.30-fast
    material: roll-5
    count: 1
    settings: {wall_line_count: 2, infill_sparse_density: 20, infill_pattern: lines, infill_line_distance: 2.5, zig_zaggify_infill: true, top_layers: 0, bottom_layers: 0, initial_bottom_layers: 0, top_bottom_thickness: 0, roofing_layer_count: 0, flooring_layer_count: 0, hole_xy_offset: 0, adhesion_type: brim, brim_line_count: 10, brim_location: outside, speed_print: 80, speed_infill: 80, speed_wall_0: 70, speed_wall_x: 80, speed_topbottom: 70, speed_roofing: 60, speed_layer_0: 30, speed_print_layer_0: 30, skirt_brim_speed: 30, acceleration_print: 3000, acceleration_infill: 3000, acceleration_wall_0: 2000, acceleration_wall_x: 2500, acceleration_topbottom: 2500, acceleration_skirt_brim: 2500, material_print_temperature: 220, cool_min_layer_time: 5}
    files: [stl/lid.stl]

docs:
  - name: Build guide
    file: pinkstuff-basket.pdf

# The parts in their places, Z up (Z = 0 at the cut edge of the jug). The viewer removes the last item first.
assemblies:
  - name: Desiccant basket
    description: >-
      The collar on the cut jug, the basket in the collar, and the lid on top.
    items:
      - name: Jug (bottom half)
        file: build/mesh/jug.stl
        color: "#e9a3c0"
      - part: Collar
        file: build/mesh/collar.stl
        explode: [0, 0, 1]
      - part: Basket
        file: build/mesh/basket.stl
        explode: [0, 0, 2]
      - part: Lid
        file: build/mesh/lid.stl
        explode: [0, 0, 3]
  - name: Cutting ring
    description: >-
      The cutting ring, the blade cartridge on its shelf, the M2.5 heat-set insert, the M2.5 x 12 lock screw, and a single-edge razor blade
      (1.5 in long, 11/16 to 3/4 in wide, with a folded steel spine). The blade slides into the back end of the
      cartridge.
    items:
      - part: Cutting ring
        file: build/mesh/jig.stl
      - part: Blade cartridge
        file: build/mesh/jig_cart.stl
        explode: [1, 0, 0]
      - name: Razor blade (single edge, 1.5 in)
        file: build/mesh/blade.stl
        color: "#b8bcc0"
        explode: [2, 0, 0]
      - name: M2.5 heat-set insert
        file: build/mesh/insert.stl
        color: "#c9a74a"
      - name: M2.5 x 12 socket head screw
        file: build/mesh/screw.stl
        color: "#55595e"
        explode: [0, 0, 1]
